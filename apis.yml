aid: tradedepot
name: TradeDepot
description: >-
  TradeDepot is a Lagos-based B2B commerce and distribution platform that connects
  consumer-goods brands and distributors with neighborhood retailers across Africa.
  Its ShopTopUp platform lets small retailers order and pay for inventory, and its
  first-party developer surface is a set of ShopTopUp "Agent/Shop Checkout" mobile
  SDKs (Android, React Native, Cordova) published under github.com/tradedepot and
  npm, initialized with partner API keys. TradeDepot publishes no public REST API,
  developer portal, or API documentation. Backed by Partech.
